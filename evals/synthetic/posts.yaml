# Synthetic job posts (public). Every company,
# person, address and number is fictional. Addresses use IANA's documentation
# domains (example.com, example.org, example.net), and phone numbers use the
# US fictional range 555-01xx or all-zero Pakistani numbers, so no real
# person can be reached. Each post is rendered to a phone-sized screenshot by
# a script; `expect` holds what the runner checks (evals/synthetic.ts): company,
# role, route, contact and eligibility are scored as the archive's labels are,
# eligibility as the sample profile meets the post; the other keys are checks
# on what the model noticed, each in the post's words where it quotes them; a
# key the runner does not know is refused rather than skipped.

- id: S01-email-simple
  tests: email route, accepted subject format, eligible worldwide remote, production depth
  render: { width: 1080, height: 2400 }
  text: |
    Northwind Analytics is hiring a Senior Full-Stack Engineer (Remote, worldwide).
    You will build our customer dashboard in React and Node.js on PostgreSQL.
    Must have: 4+ years with React; production Node.js; PostgreSQL.
    Nice to have: AWS.
    Apply by email to jobs@example.com with the subject
    "Application - Senior Full-Stack Engineer - Your Name".
  expect:
    company: Northwind Analytics
    role: Senior Full-Stack Engineer
    route: email
    contact: jobs@example.com
    eligibility: eligible
    must: ["4+ years with React", "production Node.js", "PostgreSQL"]
    depth: { "production Node.js": production }
    instructions: [{ kind: subject_format, addressed_to_ai: false }]

- id: S02-us-only
