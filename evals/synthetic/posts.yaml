  render: { width: 1080, height: 2400 }
  text: |
    Contoso Health - Backend Engineer (Remote - US only)
    Candidates must be authorized to work in the United States.
    We are unable to sponsor visas.
    Must have: Python, FastAPI, 3+ years.
    Send your resume to careers@example.org.
  expect:
    company: Contoso Health
    role: Backend Engineer
    route: email
    contact: careers@example.org
    eligibility: likely_ineligible

